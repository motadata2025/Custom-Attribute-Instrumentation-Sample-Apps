; PHP Configuration for OpenTelemetry
; Enable auto-instrumentation for trace generation

; Enable OpenTelemetry hooks for auto-instrumentation
; If you experience segfaults, set this to Off
opentelemetry.attr_hooks_enabled = On

; Display warnings to help debug issues
opentelemetry.display_warnings = On

; Increase memory limit to prevent crashes
memory_limit = 256M

; Enable error reporting
display_errors = On
error_reporting = E_ALL

; Disable opcache for development to prevent caching issues
opcache.enable = 0

